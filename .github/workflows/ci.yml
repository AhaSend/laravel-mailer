name: CI

on:
  push:
    branches: [main, "parity/**"]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        laravel: ["11", "12", "13"]
        exclude:
          - { php: "8.2", laravel: "13" } # Laravel 13 needs PHP 8.3+
        include:
          - { laravel: "11", testbench: "9" }
          - { laravel: "12", testbench: "10" }
          - { laravel: "13", testbench: "11" }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      # Until ahasend/symfony-mailer is on Packagist, install it from its GitHub repository.
      - run: composer config repositories.symfony-mailer vcs https://github.com/AhaSend/symfony-mailer
      # Laravel 11 is end-of-life and has open advisories, which Composer blocks by default.
      - run: >-
          composer update --no-interaction --no-progress
          --with "laravel/framework:^${{ matrix.laravel }}.0"
          --with "orchestra/testbench:^${{ matrix.testbench }}.0"
          ${{ matrix.laravel == '11' && '--no-security-blocking' || '' }}
      - run: vendor/bin/phpunit

  coding-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2
      # Until ahasend/symfony-mailer is on Packagist, install it from its GitHub repository.
      - run: composer config repositories.symfony-mailer vcs https://github.com/AhaSend/symfony-mailer
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
